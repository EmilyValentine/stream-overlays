<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle Boosts and Power-ups</title>
<!--
  Battle boost and power-up overlay — stream overlay
  Browser / Link source size: 760 x 300 (scales to any size). Transparent background.
  Needs live-bridge.mjs. Shows nothing until a boost challenge, boost, First Gift bonus or power-up is happening.
  ?demo=firstgift previews the First Gift pill.

    bg       transparent | green | dark
    demo=1   Show sample states for positioning
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{--blush:#f6e6f0;--muted:#e877ad;--mine1:#c41f63;--mine2:#8b5cff;--their1:#1f6f8b;--their2:#3a3f8f;--gold:#f2c46d}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden}
  body.bg-green{background:#00b140} body.bg-dark{background:#0b0614}
  #stage{position:absolute;left:0;top:0;width:760px;height:300px;transform-origin:0 0}

  .boost{position:absolute;left:20px;top:16px;width:720px;height:118px;border-radius:60px;
    background:linear-gradient(100deg,#2a0a3d 0%,#1a0630 55%,#10082a 100%);
    box-shadow:0 0 0 1.5px rgba(255,95,162,.45),0 0 12px rgba(255,45,122,.22);
    opacity:0;transform:translateY(-12px) scale(.97);transition:opacity .35s,transform .35s}
  .boost.show{opacity:1;transform:none}
  .mult{position:absolute;white-space:nowrap;left:10px;top:9px;width:100px;height:100px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 35% 30%,#e8559a,#c41f63 50%,#6e0c3c 100%);
    box-shadow:0 0 0 4px #1a0630,0 0 0 6px rgba(255,95,162,.55);font:900 44px/1 Outfit,sans-serif;color:var(--blush)}
  .boost.active .mult{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 4px #1a0630,0 0 0 6px rgba(242,196,109,.8),0 0 22px rgba(242,196,109,.45)}}
  .btext{position:absolute;left:130px;top:22px;right:34px}
  .bk{font:800 16px/1 Outfit,sans-serif;letter-spacing:.24em;color:var(--muted)}
  .bline{margin-top:8px;display:flex;align-items:baseline;gap:12px;white-space:nowrap;overflow:hidden}
  .bmain{font:700 40px/1 Fredoka,sans-serif;color:var(--blush)}
  .bsub{font:800 18px/1 Outfit,sans-serif;color:var(--muted)}
  .boost.active .bmain{color:var(--gold)}
  .boost.failed .bmain{color:#b9a7c7}
  .bbar{position:absolute;left:130px;right:34px;bottom:18px;height:7px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
  .bfill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--mine1),var(--mine2));transition:width .5s linear}
  .boost.active .bfill{background:linear-gradient(90deg,#d89a3a,var(--gold))}

  .cards{position:absolute;left:20px;top:150px;width:720px;display:flex;gap:12px;flex-wrap:wrap}
  .card{display:flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;border-radius:40px;min-width:330px;
    background:linear-gradient(100deg,#2a0a3d,#140728);box-shadow:0 0 0 1.5px rgba(255,95,162,.45);
    animation:in .4s cubic-bezier(.2,1.2,.4,1)}
  .card.theirs{background:linear-gradient(100deg,#0f2a3a,#0d1530);box-shadow:0 0 0 1.5px rgba(80,180,220,.45)}
  @keyframes in{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
  .cicon{position:relative;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;overflow:visible;background:linear-gradient(135deg,var(--mine1),var(--mine2));font:900 20px/1 Outfit,sans-serif;color:var(--blush)}
  .card.theirs .cicon{background:linear-gradient(135deg,var(--their1),var(--their2))}
  .cicon img{width:44px;height:44px;object-fit:contain}
  .cx{position:absolute;right:-6px;bottom:-4px;font:900 13px/1 Outfit,sans-serif;color:#f6e6f0;background:#c41f63;border-radius:8px;padding:3px 5px;box-shadow:0 0 0 2px #1a0630}
  .ctext{min-width:0}
  .cname{font:700 22px/1.1 Fredoka,sans-serif;color:var(--blush);white-space:nowrap}
  .cmeta{font:700 14px/1.3 Outfit,sans-serif;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
  .card.theirs .cmeta{color:#8fd0e8}
  .ctime{margin-left:auto;font:700 24px/1 Fredoka,sans-serif;color:var(--blush)}

  .crit{position:absolute;right:30px;top:120px;font:900 34px/1 Outfit,sans-serif;font-style:italic;color:var(--gold);
    text-shadow:0 2px 3px rgba(0,0,0,.5);animation:crit 1.6s cubic-bezier(.2,1.3,.4,1) forwards;pointer-events:none}
  @keyframes crit{0%{opacity:0;transform:scale(.4) rotate(-8deg)}20%{opacity:1;transform:scale(1.15) rotate(-4deg)}70%{opacity:1;transform:scale(1) rotate(-4deg)}100%{opacity:0;transform:translateY(-20px) rotate(-4deg)}}
  .award{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);max-width:740px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    padding:16px 32px;border-radius:50px;background:linear-gradient(90deg,#c41f63,#8b5cff);color:#fff;font:700 36px/1 Fredoka,sans-serif;
    box-shadow:0 0 0 3px rgba(255,255,255,.25),0 0 18px rgba(255,45,122,.45);text-shadow:0 2px 3px rgba(0,0,0,.35);animation:award 7s ease forwards;pointer-events:none}
  .award .gift{font-size:38px;margin-right:10px}
  @keyframes award{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}10%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="boost" id="boost">
    <div class="mult" id="mult">×2</div>
    <div class="btext">
      <div class="bk" id="bk">BOOST CHALLENGE</div>
      <div class="bline"><span class="bmain" id="bmain">–</span><span class="bsub" id="bsub"></span></div>
    </div>
    <div class="bbar"><div class="bfill" id="bfill"></div></div>
  </div>
  <div class="cards" id="cards"></div>
</div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get('bg') === 'green') document.body.classList.add('bg-green');
  if (q.get('bg') === 'dark') document.body.classList.add('bg-dark');
  const stage = document.getElementById('stage');
  const fit = () => { const s = Math.min(innerWidth / 760, innerHeight / 300); stage.style.transform = `translate(${(innerWidth - 760 * s) / 2}px,${(innerHeight - 300 * s) / 2}px) scale(${s})`; };
  addEventListener('resize', fit); fit();
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const mmss = (ms) => { const t = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };

  let boost = null, failedUntil = 0, powerups = [], firstGift = null, battleLive = true;

  function renderBoost() {
    const el = $('boost');
    const now = Date.now();
    const b = boost;
    const visible = battleLive && b && (['challenge', 'progress', 'waiting', 'scheduled', 'active'].includes(b.phase) || (b.phase === 'failed' && now < failedUntil));
    const fg = firstGift;
    const fgLive = battleLive && fg && fg.endsAt && now < fg.endsAt;
    // The boost takes priority; otherwise the First Gift bonus uses the same pill.
    if (!visible && fgLive) {
      el.classList.add('show', 'active'); el.classList.remove('failed');
      $('mult').textContent = fg.multiplier ? `×${fg.multiplier}` : '1st';
      $('bk').textContent = 'FIRST GIFT BONUS';
      $('bmain').textContent = mmss(fg.endsAt - now);
      $('bsub').textContent = fg.multiplier ? `EVERYONE'S FIRST GIFT ×${fg.multiplier}` : `EVERYONE'S FIRST GIFT COUNTS EXTRA`;
      const span = (fg.endsAt - fg.startsAt) || 55000;
      $('bfill').style.width = Math.max(0, Math.min(100, (fg.endsAt - now) / span * 100)) + '%';
      return;
    }
    el.classList.toggle('show', Boolean(visible));
    if (!visible) return;
    el.classList.toggle('active', b.phase === 'active');
    el.classList.toggle('failed', b.phase === 'failed');
    $('mult').textContent = b.multiplier ? `×${b.multiplier}` : '×?';
    const side = b.side === 'opponent' ? ' · THEIRS' : '';
    if (b.phase === 'active') {
      $('bk').textContent = 'BOOST ACTIVE' + side;
      $('bmain').textContent = b.endsAt ? mmss(b.endsAt - now) : 'NOW';
      $('bsub').textContent = 'GIFTS COUNT DOUBLE'.replace('DOUBLE', b.multiplier === 3 ? 'TRIPLE' : 'DOUBLE');
      $('bfill').style.width = b.endsAt && b.startsAt ? Math.max(0, Math.min(100, (b.endsAt - now) / (b.endsAt - b.startsAt) * 100)) + '%' : '100%';
    } else if (b.phase === 'scheduled') {
      $('bk').textContent = 'BOOST STARTING SOON' + side;
      $('bmain').textContent = b.startsAt ? `in ${mmss(b.startsAt - now)}` : 'SOON';
      $('bsub').textContent = b.durationSec ? `FOR ${b.durationSec}s` : '';
      $('bfill').style.width = '100%';
    } else if (b.phase === 'failed') {
      $('bk').textContent = 'BOOST CHALLENGE' + side;
      $('bmain').textContent = 'MISSED';
      $('bsub').textContent = 'NEXT TIME';
      $('bfill').style.width = '0%';
    } else {
      // Bonus mission: e.g. "1 gifter" or "10 in gifts" to unlock the next boost.
      const reward = `${b.multiplier ? '×' + b.multiplier : 'BOOST'}${b.durationSec ? ' FOR ' + b.durationSec + 's' : ''}`;
      const target = Number(b.target) || 0, prog = Number(b.progress) || 0;
      const unit = b.targetType === 2 ? 'IN GIFTS' : (target === 1 ? 'GIFTER' : 'GIFTERS');
      const notYet = b.missionStartsAt && now < b.missionStartsAt;
      $('bk').textContent = (notYet ? 'BONUS MISSION SOON' : 'BONUS MISSION') + side;
      if (b.phase === 'waiting') {
        $('bmain').textContent = 'DONE!';
        $('bsub').textContent = 'WAITING ON THEM';
      } else if (target) {
        $('bmain').textContent = `${Math.min(prog, target)}/${target} ${unit}`;
        const left = notYet ? b.missionStartsAt - now : b.missionEndsAt ? b.missionEndsAt - now : 0;
        $('bsub').textContent = `${notYet ? 'IN ' + mmss(left) : left > 0 ? mmss(left) + ' LEFT' : ''} → ${reward}`;
      } else {
        $('bmain').textContent = 'UNLOCK IT';
        $('bsub').textContent = reward;
      }
      let p = b.phase === 'waiting' ? 1 : target ? prog / target : prog > 1 ? prog / 100 : prog;
      $('bfill').style.width = Math.max(2, Math.min(100, p * 100)) + '%';
    }
  }

  function renderCards() {
    const now = Date.now();
    const live = powerups.filter((p) => p.side !== 'opponent' && (!p.endsAt || p.endsAt > now));
    $('cards').innerHTML = live.map((p) => {
      const theirs = p.side === 'opponent';
      const chance = p.critLow ? ` · ${p.critLow}${p.critHigh && p.critHigh !== p.critLow ? '–' + p.critHigh : ''}% chance of ×${p.multiple || 5}` : '';
      return `<div class="card${theirs ? ' theirs' : ''}" data-id="${esc(p.id)}">
        <div class="cicon">${p.image ? `<img src="${esc(p.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}${p.multiple ? `<span class="cx">×${p.multiple}</span>` : (p.image ? '' : '★')}</div>
        <div class="ctext"><div class="cname">${esc(p.name)}</div><div class="cmeta">from ${esc(p.by)}${chance}</div></div>
        <div class="ctime">${p.endsAt ? mmss(p.endsAt - now) : ''}</div></div>`;
    }).join('');
  }

  setInterval(() => { renderBoost(); renderCards(); }, 250);

  function award(users) {
    const el = document.createElement('div');
    el.className = 'award';
    const who = users.length === 1 ? users[0] : users.slice(0, 3).join(', ') + (users.length > 3 ? ` +${users.length - 3}` : '');
    el.innerHTML = `<span class="gift">🎁</span>${esc(who)} ${users.length === 1 ? 'earned a power-up!' : 'earned power-ups!'}`;
    stage.querySelectorAll('.award').forEach((x) => x.remove());
    stage.appendChild(el); setTimeout(() => el.remove(), 7000);
  }

  function crit(text) {
    const el = document.createElement('div');
    el.className = 'crit'; el.textContent = text;
    stage.appendChild(el); setTimeout(() => el.remove(), 1700);
  }

  if (q.get('demo') === 'mission') {
    const n = Date.now();
    boost = { phase: 'progress', multiplier: 3, durationSec: 60, targetType: 1, target: 3, progress: 1, missionStartsAt: n - 5000, missionEndsAt: n + 45000 };
  }
  if (q.get('demo') === 'firstgift') {
    const go = () => { const n = Date.now(); firstGift = { multiplier: null, startsAt: n, endsAt: n + 55000 }; };
    go(); setInterval(go, 58000);
  }
  if (q.get('demo') === '1') {
    const now = Date.now();
    boost = { phase: 'active', multiplier: 2, side: 'mine', startsAt: now - 10000, endsAt: now + 40000, durationSec: 50 };
    powerups = [
      { id: 'a', name: 'Boosting Glove', multiple: 5, critLow: 20, critHigh: 30, side: 'mine', by: 'Audrey', endsAt: now + 23000, image: 'https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/card_crit_v3~tplv-obj.png' },
      { id: 'b', name: 'Music Booster', multiple: null, side: 'mine', by: 'J', endsAt: now + 41000 }
    ];
    setInterval(() => crit('×5 HIT!'), 4000);
    setTimeout(() => award(['💜 - J - 💜']), 1200);
  }

  const BRIDGE = q.get('bridge') || (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? location.origin : 'http://localhost:3000');
  if (!q.get('demo') && 'EventSource' in window) {
    try {
      const es = new EventSource(BRIDGE + '/events');
      es.addEventListener('state', (e) => {
        const st = JSON.parse(e.data);
        const prev = boost?.phase;
        boost = st.boost || null;
        if (boost && boost.phase === 'failed' && prev !== 'failed') failedUntil = Date.now() + 6000;
        powerups = st.powerups || [];
        firstGift = st.firstGift || null;
        battleLive = !st.battle || st.battle.phase === 'live';
      });
      es.addEventListener('event', (e) => {
        const ev = JSON.parse(e.data);
        if (ev.kind === 'crit') crit('×5 HIT!');
        if (ev.kind === 'firstGiftHit') crit(`${String(ev.nickname || '').slice(0, 14)} ×${ev.multiplier}!`);
        if (ev.kind === 'powerupAwarded' && ev.users?.length) award(ev.users);
      });
    } catch { /* no bridge */ }
  }

  let loaded = q.get('v');
  async function check() {
    try {
      const r = await fetch(new URL('version.txt?t=' + Date.now(), location.href), { cache: 'no-store' });
      if (!r.ok) return; const v = (await r.text()).trim(); if (!v) return;
      if (loaded === null) { loaded = v; return; }
      if (v !== loaded) { const u = new URL(location.href); u.searchParams.set('v', v); location.replace(u.href); }
    } catch {}
  }
  check(); setInterval(check, 60000);
})();
</script>
</body>
</html>
