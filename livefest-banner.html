<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVE Fest 2026 Gift Banner</title>
<!--
  LIVE Fest 2026 animated gift banner — stream overlay
  ----------------------------------------------------
  Use as a Browser Source (OBS / TikTok LIVE Studio "Link" source).
  Recommended source size: 1080 x 380 (scales to any width).
  Background is transparent by default.

  URL options (add after the file path, e.g. livefest-banner.html?handle=CuddleMeXO&mult=2):
    handle   Name shown on the team chip          (default: CuddleMeXO)
    mult     FEST gift points per coin            (default: 2)
    speed    Seconds each featured gift is shown  (default: 4)
    bg       transparent | green | dark           (default: transparent)
    round    Power League round number            (default: 2)
    top      Rank needed to advance               (default: 200)
    next     Next round label                     (default: Round 3)
    ends     Round end text                       (default: Dec 1)
    points   Your current points (shows progress) (optional)
    goal     Points needed to reach the top rank  (optional, used with points)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff2d7a; --hot:#ff5fa2; --cyan:#22f0ff; --violet:#8b5cff; --gold:#ffd15c;
    --ink:#fff; --glass:rgba(20,8,44,.80);
    --W:1080px; --H:380px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden}
  body.bg-green{background:#00b140}
  body.bg-dark{background:#0b0614}
  #stage{position:absolute;left:0;top:0;width:var(--W);height:var(--H);transform-origin:0 0}

  /* ---------- frame ---------- */
  .banner{position:absolute;inset:14px;border-radius:38px;isolation:isolate}
  .banner::before{ /* rotating neon border */
    content:"";position:absolute;inset:-4px;border-radius:42px;z-index:-2;
    background:conic-gradient(from var(--a),var(--pink),var(--violet),var(--cyan),var(--gold),var(--pink));
    animation:spin 6s linear infinite;filter:saturate(1.2);
  }
  .banner::after{ /* outer glow */
    content:"";position:absolute;inset:-4px;border-radius:42px;z-index:-3;
    background:conic-gradient(from var(--a),var(--pink),var(--violet),var(--cyan),var(--gold),var(--pink));
    filter:blur(18px);opacity:.55;animation:spin 6s linear infinite;
  }
  @property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
  @keyframes spin{to{--a:360deg}}
  .inner{position:absolute;inset:0;border-radius:38px;overflow:hidden;
    background:
      radial-gradient(120% 90% at 0% 0%,rgba(255,45,122,.32),transparent 55%),
      radial-gradient(90% 100% at 100% 100%,rgba(34,240,255,.22),transparent 55%),
      linear-gradient(135deg,#1c0838 0%,#120626 60%,#0d0a2a 100%);
  }
  .inner::before{ /* subtle grid */
    content:"";position:absolute;inset:0;opacity:.10;
    background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);
    background-size:36px 36px;mask-image:radial-gradient(80% 80% at 50% 40%,#000,transparent);
  }
  canvas#fx{position:absolute;inset:0;width:100%;height:100%}

  /* ---------- left: title ---------- */
  .title{position:absolute;left:46px;top:52px;width:420px}
  .wordmark{margin-top:0;font:900 96px/0.88 Outfit,sans-serif;letter-spacing:-.02em;position:relative}
  .wordmark .l1,.wordmark .l2{display:block;
    background:linear-gradient(100deg,#fff 0%,#ffd6e8 20%,var(--hot) 40%,var(--cyan) 60%,#fff 80%,#ffd6e8 100%);
    background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 5s ease-in-out infinite;filter:drop-shadow(0 4px 18px rgba(255,45,122,.45))}
  .wordmark .l2{animation-delay:-.4s}
  @keyframes shine{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
  .team{margin-top:26px;display:inline-flex;align-items:center;gap:12px;padding:10px 22px 10px 12px;border-radius:99px;
    background:linear-gradient(#1a0733,#1a0733) padding-box,linear-gradient(90deg,var(--pink),var(--violet),var(--cyan)) border-box;
    border:2px solid transparent;box-shadow:0 0 18px rgba(255,45,122,.45),inset 0 0 14px rgba(255,45,122,.18);
    font:700 27px/1 Fredoka,sans-serif;color:#fff;text-shadow:0 0 10px rgba(255,95,162,.85),0 2px 3px rgba(0,0,0,.6)}
  .team .heart{width:34px;height:34px;animation:beat 1.2s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(.96)}45%{transform:scale(1.12)}}
  .team small{font:800 15px/1 Outfit,sans-serif;letter-spacing:.2em;color:#ff9cc8;text-shadow:none;margin-right:2px}

  /* ---------- right: featured gift ---------- */
  .feature{position:absolute;left:486px;top:24px;width:548px;height:252px;border-radius:28px;
    background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 20px 40px rgba(0,0,0,.25);overflow:hidden}
  .feature .label{position:absolute;right:24px;top:20px;font:800 15px/1 Outfit,sans-serif;letter-spacing:.24em;color:var(--cyan)}
  .slot{position:absolute;inset:0}
  .card{position:absolute;inset:0;display:flex;align-items:center;padding:0 24px 0 8px;gap:10px}
  .card.in{animation:cardIn .7s cubic-bezier(.2,1.3,.4,1) .38s both}
  .card.out{animation:cardOut .36s ease-in both}
  @keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.92)}to{opacity:1;transform:none}}
  @keyframes cardOut{to{opacity:0;transform:translateY(-34px) scale(.95)}}
  .icon-wrap{position:relative;width:236px;height:236px;flex:none;display:grid;place-items:center}
  .icon-wrap::before{content:"";position:absolute;inset:8px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,95,162,.55),rgba(139,92,255,.25) 55%,transparent 70%);animation:halo 2.4s ease-in-out infinite}
  .icon-wrap::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(255,255,255,.25);animation:rot 14s linear infinite}
  @keyframes halo{50%{transform:scale(1.1);opacity:.75}}
  @keyframes rot{to{transform:rotate(360deg)}}
  .icon-wrap svg,.icon-wrap img{position:relative;width:208px;height:208px;object-fit:contain;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.4))}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
  .info{min-width:0;padding-top:26px}
  .gname{font:700 28px/1.05 Fredoka,sans-serif;color:#fff;text-shadow:0 2px 14px rgba(255,45,122,.5)}
  .gname.long{font-size:26px}
  .row{margin-top:12px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
  .chip{display:inline-flex;align-items:center;gap:8px;font:800 19px/1 Outfit,sans-serif;padding:8px 13px;border-radius:14px}
  .chip.coins{background:rgba(255,209,92,.14);color:var(--gold);border:1px solid rgba(255,209,92,.4)}
  .chip.pts{background:rgba(34,240,255,.12);color:var(--cyan);border:1px solid rgba(34,240,255,.4)}
  .chip svg{width:22px;height:22px}
  .dots{position:absolute;left:250px;right:0;bottom:12px;display:flex;justify-content:flex-start;padding-left:2px;gap:7px}
  .dots i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.25);transition:all .4s}
  .dots i.on{width:26px;background:linear-gradient(90deg,var(--pink),var(--cyan))}


  /* ---------- goal bar ---------- */
  .goal{position:absolute;left:486px;top:286px;width:548px;height:52px}
  .goal-top{display:flex;justify-content:space-between;align-items:baseline;font:800 16px/1 Outfit,sans-serif;letter-spacing:.14em;color:#fff}
  .goal-top .lbl b{color:var(--gold)}
  .goal-top .val{font:700 18px/1 Fredoka,sans-serif;letter-spacing:.02em;color:var(--cyan)}
  .bar{position:relative;margin-top:10px;height:16px;border-radius:99px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);overflow:hidden}
  .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--pink),var(--violet),var(--cyan));box-shadow:0 0 16px rgba(255,45,122,.6);
    transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
  .fill::after{content:"";position:absolute;inset:0;border-radius:99px;
    background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:220% 100%;animation:sweep 2.4s linear infinite}
  @keyframes sweep{from{background-position:120% 0}to{background-position:-120% 0}}
  .flag{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:11px;line-height:1}
  @media (prefers-reduced-motion:reduce){*{animation-duration:0s!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="banner">
    <div class="inner">
      <canvas id="fx"></canvas>

      <div class="title">
        <div class="wordmark">
          <span class="l1">LIVE</span><span class="l2">FEST</span>
        </div>
        <div class="team">
          <svg class="heart" viewBox="0 0 32 32"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8fc0"/><stop offset="1" stop-color="#ff2d7a"/></linearGradient></defs><path d="M16 28S3 20.2 3 11.2C3 7 6.2 4 10 4c2.6 0 4.8 1.4 6 3.5C17.2 5.4 19.4 4 22 4c3.8 0 7 3 7 7.2C29 20.2 16 28 16 28z" fill="url(#hg)"/><ellipse cx="10.5" cy="10" rx="3" ry="2" fill="#fff" opacity=".55" transform="rotate(-30 10.5 10)"/></svg>
          <small>TEAM</small><span id="handle">CuddleMeXO</span>
        </div>
      </div>

      <div class="feature">
        <div class="label">FEST GIFT SPOTLIGHT</div>
        <div class="slot" id="slot"></div>
        <div class="dots" id="dots"></div>
      </div>

      <div class="goal">
        <div class="goal-top"><span class="lbl" id="goalLbl">ROUND 2 · <b>TOP 200</b> → ROUND 3</span><span class="val" id="goalVal">ENDS DEC 1</span></div>
        <div class="bar"><div class="fill" id="fill"></div></div>
      </div>

    </div>
  </div>
</div>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const HANDLE = q.get('handle') || 'CuddleMeXO';
  const MULT = Math.max(1, parseFloat(q.get('mult')) || 2);
  const SPEED = Math.max(2, parseFloat(q.get('speed')) || 4) * 1000;
  const BG = q.get('bg');
  if (BG === 'green') document.body.classList.add('bg-green');
  if (BG === 'dark') document.body.classList.add('bg-dark');
  document.getElementById('handle').textContent = HANDLE;

  /* ---------- fit to window ---------- */
  const stage = document.getElementById('stage');
  function fit(){
    const s = Math.min(innerWidth / 1080, innerHeight / 380);
    stage.style.transform = `translate(${(innerWidth - 1080*s)/2}px,${(innerHeight - 380*s)/2}px) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  /* ---------- icons (original illustrations) ---------- */
  const G = (id,a,b) => `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
  const shine = `<ellipse cx="44" cy="38" rx="12" ry="7" fill="#fff" opacity=".45" transform="rotate(-35 44 38)"/>`;
  const ICONS = {
    ticket:`<defs>${G('a','#ff8fc0','#ff2d7a')}${G('b','#22f0ff','#8b5cff')}</defs>
      <g transform="rotate(-12 60 60)"><path d="M18 36h84a6 6 0 0 1 6 6v8a10 10 0 0 0 0 20v8a6 6 0 0 1-6 6H18a6 6 0 0 1-6-6v-8a10 10 0 0 0 0-20v-8a6 6 0 0 1 6-6z" fill="url(#a)"/>
      <path d="M80 38v44" stroke="#fff" stroke-width="3" stroke-dasharray="5 5" opacity=".7"/>
      <text x="46" y="68" font-family="Outfit,sans-serif" font-weight="900" font-size="22" fill="#fff" text-anchor="middle">FEST</text>
      <text x="94" y="67" font-family="Fredoka,sans-serif" font-weight="700" font-size="16" fill="#fff" text-anchor="middle">26</text>
      <rect x="18" y="40" width="56" height="8" rx="4" fill="#fff" opacity=".3"/></g>`,
    pop:`<defs>${G('a','#ffd15c','#ff5fa2')}${G('b','#22f0ff','#8b5cff')}</defs>
      <circle cx="60" cy="56" r="30" fill="url(#a)"/>${shine}
      <path d="M60 86l-5 8h10z" fill="#ff5fa2"/><path d="M60 94q6 10-2 20" stroke="#fff" stroke-width="2.5" fill="none" opacity=".7"/>
      <g stroke-linecap="round" stroke-width="5"><path d="M18 22l8 8" stroke="#22f0ff"/><path d="M102 20l-8 9" stroke="#ffd15c"/><path d="M12 62h10" stroke="#ff5fa2"/><path d="M98 60h10" stroke="#8b5cff"/></g>
      <circle cx="30" cy="96" r="4" fill="#22f0ff"/><circle cx="96" cy="92" r="5" fill="#ffd15c"/>`,
    gear:`<defs>${G('a','#22f0ff','#8b5cff')}${G('b','#ff8fc0','#ff2d7a')}</defs>
      <path d="M10 50h100" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <path d="M14 50h40l-4 22a14 14 0 0 1-14 12H30a14 14 0 0 1-14-12z" fill="url(#a)"/>
      <path d="M66 50h40l-2 22a14 14 0 0 1-14 12h-6a14 14 0 0 1-14-12z" fill="url(#b)"/>
      <path d="M24 58l12-4M76 58l12-4" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/>
      <path d="M60 22l4 10 10 2-8 6 2 10-8-6-8 6 2-10-8-6 10-2z" fill="#ffd15c"/>`,
    compass:`<defs>${G('a','#ffd15c','#ff9a3c')}${G('b','#22f0ff','#8b5cff')}</defs>
      <circle cx="60" cy="60" r="44" fill="url(#b)"/><circle cx="60" cy="60" r="34" fill="#1c0838"/>
      <g fill="#fff" opacity=".7"><circle cx="60" cy="30" r="3"/><circle cx="60" cy="90" r="3"/><circle cx="30" cy="60" r="3"/><circle cx="90" cy="60" r="3"/></g>
      <path d="M60 32l9 28-9 28-9-28z" fill="url(#a)" transform="rotate(35 60 60)"/>
      <path d="M60 32l9 28H51z" fill="#ff2d7a" transform="rotate(35 60 60)"/>
      <circle cx="60" cy="60" r="6" fill="#fff"/>${shine}`,
    cheers:`<defs>${G('a','#fff1b8','#ffd15c')}${G('b','#ff8fc0','#ff2d7a')}</defs>
      <g transform="rotate(-16 40 70)"><path d="M26 26h30l-4 34a11 11 0 0 1-22 0z" fill="url(#a)" stroke="#fff" stroke-width="3"/><path d="M41 71v24M30 97h22" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>
      <g transform="rotate(16 80 70)"><path d="M64 26h30l-4 34a11 11 0 0 1-22 0z" fill="url(#b)" stroke="#fff" stroke-width="3"/><path d="M79 71v24M68 97h22" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>
      <g fill="#22f0ff"><circle cx="58" cy="14" r="4"/><circle cx="46" cy="10" r="2.5"/><circle cx="72" cy="12" r="3"/></g>`,
    bolt:`<defs>${G('a','#fff6a8','#ffb020')}${G('b','#22f0ff','#8b5cff')}</defs>
      <circle cx="60" cy="60" r="46" fill="url(#b)" opacity=".35"/>
      <path d="M68 10L28 66h28l-8 44 44-60H62z" fill="url(#a)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <path d="M62 22L40 58h16" stroke="#fff" stroke-width="4" fill="none" opacity=".6" stroke-linecap="round"/>`,
    guitar:`<defs>${G('a','#ff8fc0','#ff2d7a')}${G('b','#22f0ff','#8b5cff')}</defs>
      <g transform="rotate(35 60 60)"><rect x="55" y="6" width="10" height="48" rx="3" fill="#ffd15c"/><rect x="51" y="2" width="18" height="12" rx="4" fill="#fff"/>
      <path d="M60 46c-16 0-24 10-20 20 2 5-6 8-6 18 0 14 12 24 26 24s26-10 26-24c0-10-8-13-6-18 4-10-4-20-20-20z" fill="url(#a)"/>
      <circle cx="60" cy="78" r="8" fill="#1c0838"/><path d="M57 14v80M63 14v80" stroke="#fff" stroke-width="1.2" opacity=".7"/></g>
      <path d="M16 30v-16l14-4v16" stroke="url(#b)" stroke-width="4" fill="none"/><circle cx="12" cy="30" r="5" fill="#22f0ff"/><circle cx="26" cy="27" r="5" fill="#8b5cff"/>`,
    disco:`<defs>${G('a','#e9e4ff','#8b5cff')}<clipPath id="c"><circle cx="60" cy="64" r="38"/></clipPath></defs>
      <path d="M60 4v22" stroke="#fff" stroke-width="3"/><circle cx="60" cy="64" r="38" fill="url(#a)"/>
      <g clip-path="url(#c)" stroke="#1c0838" stroke-width="2" opacity=".55">${Array.from({length:9},(_,i)=>`<path d="M20 ${30+i*9}h80"/>`).join('')}${Array.from({length:9},(_,i)=>`<path d="M${24+i*9} 20v90"/>`).join('')}</g>

      <path d="M100 20l3 7 7 3-7 3-3 7-3-7-7-3 7-3z M18 90l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#ffd15c"/>`,
    popper:`<defs>${G('a','#ffd15c','#ff2d7a')}${G('b','#22f0ff','#8b5cff')}</defs>

      <g stroke-linecap="round" stroke-width="5" fill="none"><path d="M58 40q6-16 22-14" stroke="#22f0ff"/><path d="M76 56q14-4 18-20" stroke="#ff5fa2"/><path d="M84 74q14 2 22-6" stroke="#ffd15c"/></g>
      <rect x="92" y="14" width="8" height="8" rx="2" fill="#ffd15c" transform="rotate(25 96 18)"/><circle cx="62" cy="18" r="5" fill="#ff5fa2"/><circle cx="104" cy="48" r="4" fill="#22f0ff"/><rect x="100" y="86" width="7" height="7" rx="2" fill="#8b5cff"/>`,
    spotlight:`<defs>${G('a','#fff6c9','rgba(255,209,92,0)')}${G('b','#ff8fc0','#8b5cff')}</defs>
      <path d="M30 26L4 112h112L90 26z" fill="url(#a)" opacity=".6"/>
      <rect x="30" y="14" width="60" height="18" rx="9" fill="url(#b)"/>
      <path d="M60 50l8 17 18 2-13 12 4 18-17-9-17 9 4-18-13-12 18-2z" fill="#ffd15c" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>`,
    globe:`<defs>${G('a','#22f0ff','#3a6bff')}${G('b','#ff8fc0','#ff2d7a')}<clipPath id="c"><circle cx="60" cy="60" r="38"/></clipPath></defs>
      <ellipse cx="60" cy="60" rx="54" ry="16" fill="none" stroke="url(#b)" stroke-width="5" transform="rotate(-20 60 60)"/>
      <circle cx="60" cy="60" r="38" fill="url(#a)"/>
      <g clip-path="url(#c)" fill="#7dffb0" opacity=".9"><path d="M34 40q10-8 20 0t6 16-14 8-12 6-8-14z"/><path d="M70 66q12-6 18 4t-4 18-16-4z"/><path d="M66 28q10 0 12 8-8 4-14 0z"/></g>
      ${shine}<path d="M10 76q50 16 104-26" fill="none" stroke="url(#b)" stroke-width="5" transform="rotate(0)" stroke-linecap="round"/>`,
    fireworks:`<defs>${G('a','#ffd15c','#ff9a3c')}${G('b','#ff8fc0','#ff2d7a')}</defs>
      <g stroke-linecap="round" stroke-width="5">${Array.from({length:12},(_,i)=>{const a=i*30*Math.PI/180;const c=['#ffd15c','#ff5fa2','#22f0ff','#8b5cff'][i%4];return `<path d="M${60+Math.cos(a)*18} ${56+Math.sin(a)*18}L${60+Math.cos(a)*44} ${56+Math.sin(a)*44}" stroke="${c}"/>`}).join('')}</g>
      <path d="M40 66l6-22 14 12 14-12 6 22z" fill="url(#a)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <rect x="40" y="66" width="40" height="8" rx="3" fill="url(#b)"/><circle cx="46" cy="42" r="4" fill="#fff"/><circle cx="60" cy="54" r="4" fill="#fff"/><circle cx="74" cy="42" r="4" fill="#fff"/>`
  };
  const coinSvg = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd15c"/><circle cx="12" cy="12" r="7" fill="none" stroke="#b8860b" stroke-width="1.6"/><text x="12" y="16" font-size="10" font-weight="900" text-anchor="middle" fill="#8a5a00" font-family="Outfit">C</text></svg>`;
  const starSvg = `<svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.4 4.6 1.7 7.2L12 17.6 5.7 21.4l1.7-7.2L2 9.6 9 9z" fill="#22f0ff"/></svg>`;

  /* ---------- LIVE Fest 2026 gift lineup ----------
     The five LIVE Fest 2026 gifts shown in the LIVE FEST gift tab (Australia).
     Gift images are embedded below. To swap one, replace its img value with a file path or URL.

  ];
  const fmt = n => n.toLocaleString('en-US', {maximumFractionDigits:1});

  const slot = document.getElementById('slot'), dots = document.getElementById('dots');
  dots.innerHTML = GIFTS.map(() => '<i></i>').join('');
  let idx = 0, current = null;
  function show(i){
    const g = GIFTS[i];
    const el = document.createElement('div');
    const svg = `<svg viewBox="0 0 120 120">${ICONS[g.icon].replace(/id="(\w)"/g,`id="$1${i}"`).replace(/url\(#(\w)\)/g,`url(#$1${i})`)}</svg>`;
    el.className = 'card in';
    el.innerHTML = `
      <div class="icon-wrap">${g.img ? `<img src="${g.img}" alt="" onerror="this.outerHTML=document.getElementById('fb${i}').innerHTML">` : svg}<template id="fb${i}">${svg}</template></div>
      <div class="info">
        <div class="gname${g.name.length > 14 ? ' long' : ''}">${g.name}</div>
        <div class="row">
          <span class="chip coins">${coinSvg}${fmt(g.coins)} coin${g.coins>1?'s':''}</span>
          <span class="chip pts">${starSvg}${fmt(g.coins*MULT)} pts</span>
        </div>
      </div>`;
    if (current){ const old = current; old.classList.remove('in'); old.classList.add('out'); setTimeout(() => old.remove(), 460); }
    slot.appendChild(el); current = el;
    [...dots.children].forEach((d,k) => d.classList.toggle('on', k === i));
  }
  show(0);
  setInterval(() => { idx = (idx + 1) % GIFTS.length; show(idx); }, SPEED);


  /* ---------- Power League goal ---------- */
  const ROUND = q.get('round') || '2', TOP = q.get('top') || '200', NEXT = q.get('next') || 'Round 3', ENDS = q.get('ends') || 'Dec 1';
  const PTS = parseFloat(q.get('points')), GOAL = parseFloat(q.get('goal'));
  document.getElementById('goalLbl').innerHTML = `ROUND ${ROUND} · <b>TOP ${TOP}</b> → ${NEXT.toUpperCase()}`;
  const fill = document.getElementById('fill'), val = document.getElementById('goalVal');
  if (PTS >= 0 && GOAL > 0){
    val.textContent = `${fmt(PTS)} / ${fmt(GOAL)} pts`;
    setTimeout(() => fill.style.width = Math.max(4, Math.min(100, PTS / GOAL * 100)) + '%', 300);
  } else {
    val.textContent = `ENDS ${ENDS.toUpperCase()}`;
    setTimeout(() => fill.style.width = '100%', 300);
  }
  /* ---------- particles ---------- */
  const cv = document.getElementById('fx'), cx = cv.getContext('2d');
  const W = 1052, H = 352, DPR = Math.min(2, devicePixelRatio || 1) * 1.5;
  cv.width = W * DPR; cv.height = H * DPR; cx.scale(DPR, DPR);
  const COLS = ['#ff5fa2','#22f0ff','#ffd15c','#b79cff','#ffffff'];
  const P = Array.from({length:46}, () => spawn(true));
  function spawn(init){
    return {x:Math.random()*W, y:init?Math.random()*H:H+20, r:2+Math.random()*5, vy:.25+Math.random()*.7,
      vx:(Math.random()-.5)*.3, t:Math.random()*6.28, c:COLS[(Math.random()*COLS.length)|0], k:Math.random()<.3?'heart':(Math.random()<.5?'star':'dot')};
  }
  function heart(x,y,s){cx.beginPath();cx.moveTo(x,y+s*.3);cx.bezierCurveTo(x,y-s*.3,x-s,y-s*.3,x-s,y+s*.2);cx.bezierCurveTo(x-s,y+s*.7,x,y+s,x,y+s*1.2);cx.bezierCurveTo(x,y+s,x+s,y+s*.7,x+s,y+s*.2);cx.bezierCurveTo(x+s,y-s*.3,x,y-s*.3,x,y+s*.3);cx.fill()}
  function star(x,y,s){cx.beginPath();for(let i=0;i<4;i++){const a=i*Math.PI/2;cx.lineTo(x+Math.cos(a)*s*1.8,y+Math.sin(a)*s*1.8);cx.lineTo(x+Math.cos(a+Math.PI/4)*s*.45,y+Math.sin(a+Math.PI/4)*s*.45)}cx.closePath();cx.fill()}
  (function loop(){
    cx.clearRect(0,0,W,H);
    for (let i=0;i<P.length;i++){
      const p=P[i]; p.y-=p.vy; p.x+=p.vx+Math.sin(p.t+=.02)*.25;
      if (p.y < -20) P[i] = spawn(false);
      const a = .35 + .45*Math.abs(Math.sin(p.t*1.3));
      cx.globalAlpha=a; cx.fillStyle=p.c; cx.shadowColor=p.c; cx.shadowBlur=10;
      if (p.k==='heart') heart(p.x,p.y,p.r); else if (p.k==='star') star(p.x,p.y,p.r*.9); else {cx.beginPath();cx.arc(p.x,p.y,p.r*.5,0,7);cx.fill()}
    }
    requestAnimationFrame(loop);
  })();
